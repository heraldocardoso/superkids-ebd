<main
  class="relative flex min-h-screen flex-col overflow-hidden bg-surface px-4 pb-10 pt-[calc(1.25rem+env(safe-area-inset-top,0px))] sm:px-6"
>
  <!-- Two soft yellow glows behind the content, the same warmth as the Louvor hero -->
  <div class="pointer-events-none absolute -right-24 -top-24 h-72 w-72 rounded-full bg-accent/10 blur-3xl" aria-hidden="true"></div>
  <div class="pointer-events-none absolute -bottom-32 -left-24 h-80 w-80 rounded-full bg-secondary/10 blur-3xl" aria-hidden="true"></div>

  <header class="relative mx-auto flex w-full max-w-md items-center gap-3 lg:max-w-6xl lg:px-4">
    <img src="logo-ad.svg" alt="" class="h-11 w-11" />
    <span class="flex flex-col leading-tight">
      <span class="text-lg font-black tracking-tight">
        Super Kids
        <span class="ml-1 rounded-[0.35rem] bg-accent px-1.5 py-0.5 align-[3px] text-[0.7rem] font-black tracking-wider text-ink-on-accent">EBD</span>
      </span>
      <span class="text-xs font-bold text-ink-muted">{{ t().brandSubtitle }}</span>
    </span>
  </header>

  <div
    class="relative mx-auto flex w-full max-w-md flex-1 flex-col justify-center gap-7 pt-10 lg:grid lg:max-w-6xl lg:grid-cols-[minmax(0,1.15fr)_minmax(0,26rem)] lg:items-center lg:gap-16 lg:px-4 lg:pt-0"
  >
    <section class="flex flex-col gap-3 lg:gap-5">
      <span
        class="self-start rounded-full border border-accent/55 bg-accent/10 px-3.5 py-1.5 text-[0.7rem] font-extrabold uppercase tracking-[0.14em] text-accent"
      >
        ★ {{ t().pill }}
      </span>
      <h1 class="m-0 text-[2.4rem] font-black leading-[1.05] sm:text-5xl lg:text-6xl">
        {{ t().headlineStart }}
        <span class="text-accent underline decoration-accent/45 decoration-[5px] underline-offset-[7px]">{{ t().headlineHighlight }}</span>.
      </h1>
      <p class="m-0 text-base text-ink-muted lg:text-lg">{{ t().intro }}</p>
      <app-motto variant="card" class="mt-4 hidden lg:block" />
    </section>

    <form
      class="flex flex-col gap-4 rounded-lg border border-border bg-surface-raised p-5 shadow-lg sm:p-6 lg:p-8"
      (ngSubmit)="signIn()"
      novalidate
    >
      <h2 class="m-0 text-xl font-extrabold">{{ t().cardTitle }}</h2>

      @if (error()) {
        <p
          class="m-0 rounded-md border border-status-danger/40 bg-status-danger-faded px-3 py-2.5 text-sm font-bold text-status-danger"
          role="alert"
        >
          {{ error() }}
        </p>
      }

      <div class="flex flex-col gap-1.5">
        <label for="loginEmail" class="text-xs font-extrabold uppercase tracking-wider text-ink-muted">
          {{ t().email }}
        </label>
        <input
          pInputText
          id="loginEmail"
          name="email"
          type="email"
          inputmode="email"
          autocomplete="username"
          autocapitalize="off"
          [(ngModel)]="email"
          [placeholder]="t().emailPlaceholder"
          class="w-full"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="loginPassword" class="text-xs font-extrabold uppercase tracking-wider text-ink-muted">
          {{ t().password }}
        </label>
        <p-password
          inputId="loginPassword"
          name="password"
          [(ngModel)]="password"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
          [placeholder]="t().passwordPlaceholder"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
      </div>

      <p-button
        type="submit"
        [label]="isSigningIn() ? t().signingIn : t().signIn"
        icon="pi pi-sign-in"
        severity="warning"
        [loading]="isSigningIn()"
        styleClass="mt-1 w-full justify-center !py-3 text-base"
      />

      <p class="m-0 text-center text-sm text-ink-muted">{{ t().help }}</p>
    </form>

    <app-motto variant="card" class="block lg:hidden" />
  </div>
</main>
