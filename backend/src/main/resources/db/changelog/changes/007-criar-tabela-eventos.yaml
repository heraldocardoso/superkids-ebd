databaseChangeLog:
  - changeSet:
      id: 007-criar-tabela-eventos
      author: super-kids-ebd
      comment: Eventos da EBD criados na app. As datas padrao (Natal, Pascoa...) sao calculadas, nao guardadas.
      changes:
        - createTable:
            tableName: eventos
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: titulo
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: data
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: hora
                  type: TIME
              - column:
                  name: lugar
                  type: VARCHAR(200)
              - column:
                  name: descricao
                  type: VARCHAR(1000)
        - createIndex:
            tableName: eventos
            indexName: ix_eventos_data
            columns:
              - column:
                  name: data
