spring:
  application:
    name: super-kids-ebd-backend
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:super_kids_ebd}
    username: ${DB_USER:ebd}
    password: ${DB_PASSWORD:ebd123}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: Europe/Lisbon

server:
  port: ${SERVER_PORT:8081}

app:
  fuso: ${TZ:Europe/Lisbon}
  jwt:
    # Em producao defina JWT_SECRET (minimo 64 caracteres)
    secret: ${JWT_SECRET:mudar-este-segredo-em-producao-super-kids-ebd-ad-santarem-casa-do-pai-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  uploads:
    dir: ${UPLOADS_DIR:uploads}
